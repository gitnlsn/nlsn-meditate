apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.meditationsession'
version = '0.1.0'

android {
  namespace "expo.modules.meditationsession"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

repositories {
  mavenCentral()
}

dependencies {
  // Pinned to the version expo-audio resolves, so the two do not drag in
  // conflicting copies of Media3 at merge time.
  def media3 = "1.8.0"
  implementation "androidx.media3:media3-exoplayer:$media3"
  implementation "androidx.media3:media3-session:$media3"
}
