apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.playgames'
version = '0.1.0'

android {
  namespace "expo.modules.playgames"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.google.android.gms:play-services-games-v2:21.0.0"
}
